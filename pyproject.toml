[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sarrthak-sitegen"
version = "2.0.0"
description = "Static site generator for sarrthak.com"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "markdown-it-py>=4,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
sitegen = "sitegen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sitegen*"]

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "space"

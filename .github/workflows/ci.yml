name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: "\x24{{ github.workflow }}-\x24{{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify-python-311:
    name: Verify on Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install generator
        run: python -m pip install .
      - name: Verify generator and site
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s src -p 'test*.py'
          python -m compileall -q src
          sitegen build --no-incremental
          sitegen check
          if grep -R -n -E '\{\{|\{%|\{#' docs --include='*.html'; then
            echo "unresolved template marker found"
            exit 1
          fi
          git diff --check

  verify-python-313:
    name: Verify on Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install generator
        run: python -m pip install .
      - name: Verify generator and site
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s src -p 'test*.py'
          python -m compileall -q src
          sitegen build --no-incremental
          sitegen check
          if grep -R -n -E '\{\{|\{%|\{#' docs --include='*.html'; then
            echo "unresolved template marker found"
            exit 1
          fi
          git diff --check

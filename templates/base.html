<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ document_title }}</title>
    <meta name="description" content="{{ meta_description }}" />
    <link rel="canonical" href="{{ page.canonical_url }}" />
    <meta property="og:type" content="{{ og_type }}" />
    <meta property="og:site_name" content="sλrthak" />
    <meta property="og:title" content="{{ document_title }}" />
    <meta property="og:description" content="{{ meta_description }}" />
    <meta property="og:url" content="{{ page.canonical_url }}" />
    <meta property="og:image" content="{{ page.social_image_url }}" />
    <meta property="og:image:alt" content="sλrthak social preview" />
    {% if og_type == "article" %}
    <meta property="article:published_time" content="{{ page.date|iso_date }}" />
    {% if page.updated %}
    <meta property="article:modified_time" content="{{ page.updated|iso_date }}" />
    {% endif %}
    {% endif %}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ document_title }}" />
    <meta name="twitter:description" content="{{ meta_description }}" />
    <meta name="twitter:image" content="{{ page.social_image_url }}" />
    <link rel="describedby" href="/llms.txt" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="sλrthak — writing"
      href="/feed.xml"
    />
    {% if page.rendered.has_math %}
    <script>
      window.MathJax = {
        tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] },
        options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    {% endif %}
    {% if page.rendered.has_code %}
    <link rel="stylesheet" href="/gruvbox-dark-hard.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.hljs) window.hljs.highlightAll();
      });
    </script>
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=optional"
      rel="stylesheet"
    />
    <link href="/index.css" rel="stylesheet" />
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  </head>
  <body class="{{ body_class }}">
    <a class="skip-link" href="#main-content">skip to content</a>
    {% include "partials/header.html" %}

    {% block main %}{% endblock %}

    {% include "partials/footer.html" %}
  </body>
</html>
